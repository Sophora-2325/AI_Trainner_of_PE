<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 健身教练 — 控制台</title>
<style>
  :root {
    --bg: #0b0d14;
    --card: rgba(22, 26, 38, 0.85);
    --border: rgba(255,255,255,0.08);
    --accent: #00d4aa;
    --accent2: #6366f1;
    --text: #eef1f6;
    --muted: #8b93a8;
    --user: #4dc9f6;
    --template: #4dff91;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    background: radial-gradient(ellipse at 20% 0%, #1a1040 0%, var(--bg) 45%),
                radial-gradient(ellipse at 80% 100%, #0a2830 0%, var(--bg) 50%);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
  }
  header h1 {
    font-size: 1.25rem; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-right: auto;
  }
  header select, header button {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 8px;
    font-size: 0.9rem; cursor: pointer;
  }
  header button:hover, header select:hover { border-color: var(--accent); }
  #status {
    padding: 6px 12px; border-radius: 20px; font-size: 0.82rem;
    border: 1px solid var(--border);
  }
  .status-on { color: #4ade80; border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.1); }
  .status-off { color: var(--danger); border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.08); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr 320px;
    grid-template-rows: 1fr;
    gap: 16px;
    padding: 16px 24px 24px;
    height: calc(100vh - 62px);
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(16px);
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .panel-head {
    padding: 12px 16px;
    font-size: 0.85rem; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-head strong { color: var(--text); font-size: 0.95rem; }

  #video-wrap { flex: 1; position: relative; background: #000; min-height: 0; }
  #live-frame {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: #050508;
  }
  #video-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 8px; pointer-events: none;
  }
  #video-placeholder.hidden { display: none; }

  #canvas3d { flex: 1; min-height: 0; width: 100%; }

  .sidebar { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }

  .score-ring {
    position: relative; width: 140px; height: 140px; margin: 16px auto;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .value {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-ring .num { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .score-ring .unit { font-size: 0.75rem; color: var(--muted); }

  .metrics {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 0 16px 12px;
  }
  .metric {
    background: rgba(255,255,255,0.04);
    border-radius: 10px; padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .metric label { font-size: 0.72rem; color: var(--muted); display: block; }
  .metric span { font-size: 1.1rem; font-weight: 700; }

  .phase-badge {
    margin: 0 16px 12px; padding: 10px 14px;
    border-radius: 10px; text-align: center; font-weight: 600;
    background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(0,212,170,0.15));
    border: 1px solid rgba(99,102,241,0.35);
  }

  .advice-box {
    margin: 0 16px 16px; padding: 14px;
    border-radius: 12px; flex: 1;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.25);
    font-size: 0.92rem; line-height: 1.55;
    min-height: 80px;
  }
  .advice-box.empty { color: var(--muted); font-style: italic; background: rgba(255,255,255,0.03); border-color: var(--border); }

  .rep-line {
    padding: 0 16px 12px; font-size: 0.88rem; color: var(--muted);
  }
  .rep-line b { color: var(--accent); font-size: 1.2rem; }

  .legend { display: flex; gap: 16px; padding: 0 16px 8px; font-size: 0.78rem; }
  .dot-user { color: var(--user); }
  .dot-tmpl { color: var(--template); }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto auto auto; overflow-y: auto; height: auto; }
    body { overflow: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>AI 健身教练</h1>
  <span style="color:var(--muted);font-size:0.85rem">Web 控制台</span>
  <select id="movement-select">
    <option value="squat">深蹲</option>
    <option value="deadlift">硬拉</option>
    <option value="pushup">俯卧撑</option>
    <option value="pullup">引体向上</option>
    <option value="plank">平板支撑</option>
  </select>
  <div id="status" class="status-off">● 未连接</div>
</header>

<div class="layout">
  <div class="panel">
    <div class="panel-head"><strong>实时画面</strong><span id="fps-label">-- FPS</span></div>
    <div id="video-wrap">
      <img id="live-frame" alt="live">
      <div id="video-placeholder">
        <div style="font-size:2rem;opacity:0.4">📷</div>
        <div>等待摄像头画面…</div>
        <div style="font-size:0.8rem">请先运行 python web_coach.py</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <strong>3D 孪生对比</strong>
      <div class="legend">
        <span class="dot-user">● 我的动作</span>
        <span class="dot-tmpl">● 标准模板</span>
      </div>
    </div>
    <canvas id="canvas3d"></canvas>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="panel-head"><strong>实时评分</strong><span id="movement-label">深蹲</span></div>
      <div class="score-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="58" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
          <circle id="score-arc" cx="70" cy="70" r="58" fill="none"
            stroke="url(#grad)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="364.4" stroke-dashoffset="364.4"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00d4aa"/>
              <stop offset="100%" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="value">
          <span class="num" id="score-num">--</span>
          <span class="unit">/ 100</span>
        </div>
      </div>
      <div class="rep-line">已完成 <b id="rep-count">0</b> 次</div>
      <div class="phase-badge" id="phase-badge">等待检测…</div>
      <div class="metrics">
        <div class="metric"><label>关节</label><span id="m-joint">--</span></div>
        <div class="metric"><label>对称</label><span id="m-sym">--</span></div>
        <div class="metric"><label>稳定</label><span id="m-stab">--</span></div>
        <div class="metric"><label>节奏</label><span id="m-tempo">--</span></div>
      </div>
    </div>
    <div class="panel" style="flex:1">
      <div class="panel-head"><strong>教练建议</strong></div>
      <div class="advice-box empty" id="advice">暂无建议，请面向摄像头做动作</div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const WS_URL = `ws://${location.hostname}:8765`;
const JOINTS = ["left_shoulder","right_shoulder","left_elbow","right_elbow",
  "left_wrist","right_wrist","left_hip","right_hip","left_knee","right_knee","left_ankle","right_ankle"];
const BONES = [[0,1],[0,6],[1,7],[6,7],[0,2],[2,4],[1,3],[3,5],[6,8],[8,10],[7,9],[9,11]];

// 面板内完整显示人体：缩放 + 相机（原 SCALE=2.5 会裁切头脚）
const SCALE = 1.45;
const CENTER_Y = 0.85;
const SIDE_OFFSET = 0.55;   // 左右两个模型的水平间距

// ─── 3D 场景 ───
const canvas = document.getElementById('canvas3d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1018);
scene.fog = new THREE.Fog(0x0e1018, 4, 14);
scene.add(new THREE.GridHelper(5, 10, 0x333355, 0x222233));
scene.add(new THREE.AmbientLight(0x606080, 2));
const dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(4, 6, 4); scene.add(dl);

const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 40);
camera.position.set(0, CENTER_Y, 6.2);
camera.lookAt(0, CENTER_Y, 0);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

function createSkeleton(color) {
  const group = new THREE.Group();
  const spheres = [], cylinders = [];
  const mat = new THREE.MeshPhongMaterial({ color, shininess: 50 });
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 16), mat.clone());
    group.add(m); spheres.push(m);
  }
  const cylGeo = new THREE.CylinderGeometry(0.012, 0.012, 1, 8);
  for (let i = 0; i < BONES.length; i++) {
    const c = new THREE.Mesh(cylGeo.clone(), mat.clone());
    c.visible = false; group.add(c); cylinders.push(c);
  }
  return { group, spheres, cylinders };
}

function updateCylinder(cyl, a, b) {
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 0.001) { cyl.visible = false; return; }
  cyl.visible = true;
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  cyl.scale.set(1, len, 1);
}

function applyPoints(skel, points, offsetX) {
  const pos = [];
  for (let i = 0; i < 12; i++) {
    const x = points[i*3] * SCALE + offsetX;
    const y = -points[i*3+1] * SCALE + CENTER_Y;
    const z = -points[i*3+2] * SCALE;
    skel.spheres[i].position.set(x, y, z);
    pos.push(new THREE.Vector3(x, y, z));
  }
  BONES.forEach(([a,b], i) => updateCylinder(skel.cylinders[i], pos[a], pos[b]));
}

const userSkel = createSkeleton(0x4dc9f6);
const tmplSkel = createSkeleton(0x4dff91);
scene.add(userSkel.group, tmplSkel.group);

const divider = new THREE.Mesh(
  new THREE.BoxGeometry(0.02, 1.6, 0.15),
  new THREE.MeshBasicMaterial({ color: 0x444466 })
);
divider.position.set(0, CENTER_Y, 0);
scene.add(divider);

let tmplFrames = [], tmplIdx = 0, tmplTimer = 0;
const TEMPLATE_FPS = 30;

function resize3d() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w && h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}
new ResizeObserver(resize3d).observe(canvas);
resize3d();

function animate3d(now) {
  requestAnimationFrame(animate3d);
  if (tmplFrames.length) {
    if (!animate3d._last) animate3d._last = now;
    const dt = Math.min((now - animate3d._last) / 1000, 0.05);
    animate3d._last = now;
    tmplTimer += dt;
    const interval = 1.0 / TEMPLATE_FPS;
    while (tmplTimer >= interval) {
      tmplTimer -= interval;
      tmplIdx = (tmplIdx + 1) % tmplFrames.length;
    }
    applyPoints(tmplSkel, tmplFrames[tmplIdx], SIDE_OFFSET);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate3d);

// ─── WebSocket ───
const statusEl = document.getElementById('status');
const liveImg = document.getElementById('live-frame');
const placeholder = document.getElementById('video-placeholder');
let ws;

function setConnected(on) {
  statusEl.textContent = on ? '● 已连接' : '● 未连接';
  statusEl.className = on ? 'status-on' : 'status-off';
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => setConnected(true);
  ws.onclose = () => { setConnected(false); setTimeout(connect, 2000); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'frame') {
      liveImg.src = 'data:image/jpeg;base64,' + msg.data;
      placeholder.classList.add('hidden');
    } else if (msg.type === 'stats') {
      updateStats(msg);
    } else if (msg.type === 'pose') {
      applyPoints(userSkel, msg.points, -SIDE_OFFSET);
    } else if (msg.type === 'template') {
      tmplFrames = msg.frames || [];
      tmplIdx = 0;
      tmplTimer = 0;
      console.log(`[3D] 标准模板: ${tmplFrames.length} 帧 @ ${TEMPLATE_FPS}fps`);
    }
  };
}
connect();

document.getElementById('movement-select').addEventListener('change', (e) => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'set_movement', movement: e.target.value }));
  }
});

const PHASE_CN = { SETUP:'准备', DESCENT:'下蹲', BOTTOM:'底部', ASCENT:'起身', LOCKOUT:'锁定', REST:'休息' };

function updateStats(s) {
  const score = s.score ?? 0;
  document.getElementById('score-num').textContent = Math.round(score);
  const arc = document.getElementById('score-arc');
  const circ = 364.4;
  arc.strokeDashoffset = circ - (score / 100) * circ;
  document.getElementById('m-joint').textContent = s.joint ?? '--';
  document.getElementById('m-sym').textContent = s.symmetry ?? '--';
  document.getElementById('m-stab').textContent = s.stability ?? '--';
  document.getElementById('m-tempo').textContent = s.tempo ?? '--';
  document.getElementById('rep-count').textContent = s.rep_count ?? 0;
  document.getElementById('fps-label').textContent = (s.fps ?? '--') + ' FPS';
  document.getElementById('movement-label').textContent = s.movement_name || s.movement || '';
  document.getElementById('phase-badge').textContent = PHASE_CN[s.phase] || s.phase || '检测中';
  const adv = document.getElementById('advice');
  if (s.advice) {
    adv.textContent = s.advice;
    adv.classList.remove('empty');
  }
}
</script>
</body>
</html>
