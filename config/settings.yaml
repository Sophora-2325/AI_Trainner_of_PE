# AI 健身教练 — 全局配置

# 摄像头
camera:
  device_id: 0
  width: 1280
  height: 720
  fps: 30

# MediaPipe Pose
pose:
  model_complexity: 2          # 0=Lite, 1=Full, 2=Heavy
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  smooth_window: 5             # EMA滤波窗口大小

# 跨系统通信 (Windows ↔ WSL2)
bridge:
  host: "localhost"
  request_port: 5000           # Windows → WSL2 (发送关键点)
  result_port: 5001            # WSL2 → Windows (返回关节角度)
  timeout_ms: 50
  retry_count: 3

# WSL2 环境
wsl:
  conda_env: "fitness_coach"
  opensim_model: "/mnt/d/Project_of_Teacher_Feng/WorkPlace/opensim_models/Rajagopal2015.osim"

# OpenSim
opensim:
  model_path: "opensim_models/Rajagopal2015.osim"
  scaled_model_path: "opensim_models/scaled_model.osim"
  ik_weight_file: "config/ik_weights.xml"

# Webots
webots:
  world_path: "webots_project/worlds/fitness_coach.wbt"
  proto_dir: "webots_project/protos"
  time_step: 16                # 仿真步长 (ms), 约60fps
  op2_host: "localhost"
  op2_port: 10020
  op2_enabled: false           # 实时镜像模式开关

# 评分
scoring:
  joint_deviation_weight: 0.50
  symmetry_weight: 0.20
  stability_weight: 0.15
  tempo_weight: 0.15
  excellent_threshold: 90
  good_threshold: 75
  warning_threshold: 60

# LLM (Qwen2-7B)
llm:
  model_path: "qwen2:7b"              # Ollama 模型名 或 HuggingFace 路径
  device: "cuda"
  max_new_tokens: 80
  temperature: 0.3
  use_4bit_quantization: true         # 4-bit量化（仅 transformers 模式）
  use_ollama: true                    # true=Ollama API / false=本地 transformers
  ollama_host: "http://localhost:11434"

# TTS
tts:
  engine: "edge-tts"           # edge-tts / pyttsx3
  voice: "zh-CN-XiaoxiaoNeural"
  rate: "+10%"                 # 语速

# UI
ui:
  show_skeleton_overlay: true
  show_score_panel: true
  show_phase_indicator: true
  show_webots_view: false      # Webots独立窗口
  dashboard_refresh_ms: 100
